<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KSPM Finance</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


    <div id="login-page" class="login-page">

        <div class="login-card">

            <div class="login-logo">
                KSPM
            </div>

            <h1>Login KSPM</h1>

            <p>
                Sistem Informasi Keuangan KSPM
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Masukkan username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        NIM
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Masukkan NIM"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

    <div class="app">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">

                KSPM
                <span>FINANCE</span>

            </div>


            <nav class="menu">

                <button
                    class="menu-item active"
                    data-page="dashboard"
                >
                    🏠
                    <span>Dashboard</span>
                </button>


                <button
                    class="menu-item"
                    data-page="anggota"
                >
                    👥
                    <span>Anggota</span>
                </button>


                <button
                    class="menu-item"
                    data-page="kas"
                >
                    💰
                    <span>Kas</span>
                </button>


                <button
                    class="menu-item"
                    data-page="transaksi"
                >
                    📝
                    <span>Transaksi</span>
                </button>


                <button
                    class="menu-item"
                    data-page="uranMakrab"
                >
                    🎉
                    <span>Uran Makrab</span>
                </button>


                <button
                    class="menu-item"
                    data-page="lepkeu"
                >
                    📊
                    <span>LEPKEU</span>
                </button>

            </nav>


            <div class="sidebar-footer">

                KSPM UMBY

                <small>
                    2026
                </small>

            </div>

        </aside>



        <!-- CONTENT -->
       
        <main class="main">


            <header class="topbar">

                <div>

                    <h1 id="page-title">
                        Dashboard
                    </h1>

                    <p id="page-description">
                        Ringkasan keuangan KSPM
                    </p>

                </div>


                <div class="user-info">

                    <div class="avatar" id="userAvatar">?</div>

                    <strong id="userName">
                        Pengguna
                    </strong>

                    <small id="userRole">
                        KSPM UMBY
                    </small>

                    <button
                        type="button"
                        onclick="logout()"
                        class="btn-logout"
                    >
                        Logout
                    </button>

                </div>

            </header>



            <!-- PAGE -->

            <section
                id="app-content"
                class="page-content"
            >

                <!-- Dashboard akan dimuat di sini -->

            </section>


        </main>


    </div>


    <script src="app.js"></script>

</body>

</html>
